<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0d1b2a" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.07)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.02)" />
    </linearGradient>

    <!-- Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 40px;
      font-weight: 800;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }
    .subtitle {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 16px;
      font-weight: 400;
      fill: #94a3b8;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 12px;
      font-weight: 600;
    }
    .flow-line {
      stroke-dasharray: 8, 8;
      animation: flow 20s linear infinite;
    }
    .pulse-node {
      animation: pulse 3s ease-in-out infinite alternate;
    }
    @keyframes flow {
      from { stroke-dashoffset: 200; }
      to { stroke-dashoffset: 0; }
    }
    @keyframes pulse {
      0% { r: 6px; opacity: 0.7; }
      100% { r: 9px; opacity: 1; }
    }
    @keyframes wave {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
      100% { transform: translateY(0px); }
    }
    .floating-card {
      animation: wave 6s ease-in-out infinite;
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />

  <!-- Subtle Grid Pattern in Background -->
  <g opacity="0.08" stroke="#38bdf8" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="150" y1="0" x2="150" y2="360" />
    <line x1="300" y1="0" x2="300" y2="360" />
    <line x1="450" y1="0" x2="450" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="750" y1="0" x2="750" y2="360" />
    <line x1="900" y1="0" x2="900" y2="360" />
    <line x1="1050" y1="0" x2="1050" y2="360" />
  </g>

  <!-- Dynamic Pipeline Streams & Telemetry Flow (in lower background) -->
  <g opacity="0.45">
    <!-- Stream 1 -->
    <path d="M 80,310 C 260,310 320,250 500,250 C 680,250 740,310 920,310 C 1020,310 1080,280 1140,280" 
          fill="none" stroke="#38bdf8" stroke-width="2" class="flow-line" />
    <!-- Stream 2 -->
    <path d="M 60,280 C 240,280 340,320 540,320 C 740,320 800,260 1000,260 C 1080,260 1120,290 1160,290" 
          fill="none" stroke="#818cf8" stroke-width="2" class="flow-line" style="animation-duration: 15s;" />
    <!-- Stream 3 -->
    <path d="M 120,330 C 300,330 400,270 600,270 C 800,270 880,330 1080,330 C 1120,330 1150,315 1180,315" 
          fill="none" stroke="#c084fc" stroke-width="1.5" class="flow-line" style="animation-duration: 25s;" />
  </g>

  <!-- Decorative Observability Node Rings -->
  <circle cx="500" cy="250" r="7" fill="#38bdf8" class="pulse-node" filter="url(#glow)" />
  <circle cx="920" cy="310" r="6" fill="#818cf8" class="pulse-node" filter="url(#glow)" style="animation-delay: 1s;" />
  <circle cx="600" cy="270" r="6" fill="#c084fc" class="pulse-node" filter="url(#glow)" style="animation-delay: 2s;" />

  <!-- Animated Telemetry Metric Cards (Floating Bottom Right) -->
  <g class="floating-card" opacity="0.9">
    <!-- Card 1: CI Flaky Detection -->
    <rect x="740" y="38" width="180" height="70" rx="10" fill="url(#cardGrad)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1" />
    <circle cx="762" cy="62" r="5" fill="#10b981" />
    <text x="776" y="66" fill="#f8fafc" class="badge-text">Flaky Test Detection</text>
    <text x="762" y="92" fill="#38bdf8" font-family="monospace" font-size="13px" font-weight="bold">99.4% Accuracy</text>

    <!-- Card 2: DORA & Pipeline MTTR -->
    <rect x="940" y="38" width="195" height="70" rx="10" fill="url(#cardGrad)" stroke="rgba(192, 132, 252, 0.3)" stroke-width="1" />
    <circle cx="962" cy="62" r="5" fill="#c084fc" />
    <text x="976" y="66" fill="#f8fafc" class="badge-text">Pipeline Analytics</text>
    <text x="962" y="92" fill="#c084fc" font-family="monospace" font-size="13px" font-weight="bold">MTTR -64% Optimized</text>
  </g>

  <!-- FOREGROUND CONTENT: Header Tag, Title, Subtitle, Metric Pills -->
  <g transform="translate(60, 45)">
    <!-- Category Pill -->
    <rect x="0" y="0" width="220" height="28" rx="14" fill="rgba(56, 189, 248, 0.15)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1" />
    <text x="14" y="18" fill="#38bdf8" class="badge-text">⚡ AWESOME CURATED DIRECTORY</text>

    <!-- Main Title -->
    <text x="0" y="75" class="title">Test Observability &amp;</text>
    <text x="0" y="125" class="title" fill="url(#accentGrad)">Pipeline Analytics 🚀</text>

    <!-- Subtitle -->
    <text x="0" y="165" class="subtitle">Comprehensive Guide to Test Health, Flaky Detection, DORA Metrics &amp; CI/CD Insights</text>
    <text x="0" y="190" class="subtitle" fill="#64748b">Comparing Enterprise Cloud SaaS Platforms &amp; Open-Source TestOps Frameworks</text>

    <!-- Feature Pills at Bottom Left -->
    <g transform="translate(0, 220)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="155" height="30" rx="8" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.12)" />
      <text x="14" y="19" fill="#e2e8f0" class="badge-text">🎯 Root Cause Triage</text>

      <!-- Pill 2 -->
      <rect x="165" y="0" width="165" height="30" rx="8" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.12)" />
      <text x="14" y="19" transform="translate(165, 0)" fill="#e2e8f0" class="badge-text">📊 Predictive Selection</text>

      <!-- Pill 3 -->
      <rect x="340" y="0" width="145" height="30" rx="8" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.12)" />
      <text x="14" y="19" transform="translate(340, 0)" fill="#e2e8f0" class="badge-text">🔍 Flaky Test Quarantine</text>

      <!-- Pill 4 -->
      <rect x="495" y="0" width="145" height="30" rx="8" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.12)" />
      <text x="14" y="19" transform="translate(495, 0)" fill="#e2e8f0" class="badge-text">📈 CI Pipeline Health</text>
    </g>
  </g>
</svg>
